    <style>
        :root {
            --theme-primary: #1e3a8a;
            --theme-accent: #2563eb;
            --theme-primary-soft: #eff6ff;
            --export-font: 'Sarabun', sans-serif;
            --export-size: 14px;
            --export-color: #111827;
            --export-weight: 400;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Export Typography Customization */
        .export-doc-area,
        .export-doc-area table,
        .export-doc-area th,
        .export-doc-area td,
        .export-doc-area div,
        .export-doc-area span,
        .export-doc-area h3 {
            font-family: var(--export-font) !important;
            color: var(--export-color);
        }
        .export-doc-area table,
        .export-doc-area th,
        .export-doc-area td {
            font-size: var(--export-size) !important;
            font-weight: var(--export-weight) !important;
        }
        .export-doc-area th,
        .export-doc-area .doc-bold {
            font-weight: 700 !important;
        }

        /* Dynamic Theme Utilities */
        .theme-bg {
            background-color: var(--theme-primary) !important;
        }
        .theme-bg-accent {
            background-color: var(--theme-accent) !important;
        }
        .theme-btn {
            background-color: var(--theme-accent);
            color: #ffffff;
        }
        .theme-btn:hover {
            filter: brightness(0.92);
        }
        .theme-text {
            color: var(--theme-primary);
        }
        .theme-soft-bg {
            background-color: var(--theme-primary-soft);
        }
        .theme-border {
            border-color: var(--theme-accent);
        }
        .nav-tab-active {
            background-color: rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
        }

        /* Drag and Drop Styles */
        .draggable {
            cursor: grab;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .dropzone {
            transition: background-color 0.2s, border-color 0.2s;
            min-height: 76px;
        }
        .dropzone.dragover {
            background-color: #e0f2fe;
            border: 2px dashed #2563eb;
        }

        /* Smooth Toast Animation */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInRight 0.25s ease-out forwards;
        }

        /* Print / PDF Styles */
        @media print {
            body {
                background-color: white !important;
                color: black !important;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            main {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin-bottom: 0 !important;
            }
            .overflow-x-auto {
                overflow: visible !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse;
                margin-bottom: 16px;
            }
            th, td {
                border: 1px solid #000 !important;
                padding: 6px 8px !important;
            }
            th {
                background-color: #f3f4f6 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .lunch-row {
                background-color: #f9fafb !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .page-break {
                page-break-after: always;
            }
            .page-break:last-child {
                page-break-after: auto;
            }
            body.printing-single .printable-section:not(.print-target) {
                display: none !important;
            }
        }

        .print-only {
            display: none;
        }

        /* Clean PNG Export Mode */
        .capturing-png .no-print,
        .capturing-png .no-capture {
            display: none !important;
        }
    </style>
</head>

                    subjects: state.subjects
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (err) {
                console.warn('Unable to persist state to localStorage:', err);
            }

            if (isCloudEnabled() && syncAction) {
                syncSaveToCloud(syncAction, syncPayload);
            }
        }

        function loadState() {
            try {
                const savedGasUrl = localStorage.getItem(GAS_URL_STORAGE_KEY);
                if (savedGasUrl !== null && !DEFAULT_GAS_API_URL) {
                    state.gasApiUrl = savedGasUrl;
                }
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (typeof parsed.isSchedulePublished === 'boolean') {
                    state.isSchedulePublished = parsed.isSchedulePublished;
                }
                if (parsed.settings && typeof parsed.settings === 'object') {
                    state.settings = Object.assign(createDefaultSettings(), parsed.settings);
                }
                if (Array.isArray(parsed.users) && parsed.users.length > 0) {
                    state.users = parsed.users;
                    // Ensure core admin always exists
                    if (!state.users.some(u => u.username === 'krunoon')) {
                        state.users.unshift(JSON.parse(JSON.stringify(INITIAL_USERS[0])));
                    }
                }
                if (Array.isArray(parsed.subjects)) {
                    state.subjects = parsed.subjects;
                }
            } catch (err) {
                console.warn('Unable to load persisted state:', err);
            }
        }

        function isInsideGAS() {

        function callGASServer(fnName, ...args) {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)[fnName](...args);
            });
        }

        async function cloudRequest(action, payload = {}) {
            if (isInsideGAS()) {
                if (action === 'getData') return await callGASServer('apiGetAllData');
                if (action === 'saveAll') return await callGASServer('apiSaveAllData', payload.data);
                if (action === 'addSubject') return await callGASServer('apiAddOrMergeSubject', payload.subject);
                if (action === 'saveSubjects') return await callGASServer('apiSaveSubjects', payload.subjects);
                if (action === 'saveUsers') return await callGASServer('apiSaveUsers', payload.users);
                if (action === 'saveSettings') return await callGASServer('apiSaveSettings', payload.settings, payload.isSchedulePublished);
                throw new Error('Unknown GAS action: ' + action);
            }

            const apiUrl = (state.gasApiUrl || '').trim();
            if (!apiUrl) throw new Error('ยังไม่ได้ตั้งค่า Web App URL');

            if (action === 'getData') {
                const sep = apiUrl.includes('?') ? '&' : '?';
                const res = await fetch(`${apiUrl}${sep}action=getData&t=${Date.now()}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            }

            // ใช้ text/plain เพื่อหลีกเลี่ยง CORS preflight ของ Google Apps Script
            const res = await fetch(apiUrl, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, ...payload })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        }

        function applyCloudDataToState(data) {
            if (!data || typeof data !== 'object') return;
            if (Array.isArray(data.users) && data.users.length > 0) {
                state.users = data.users;
                if (!state.users.some(u => u.username === 'krunoon')) {
                    state.users.unshift(JSON.parse(JSON.stringify(INITIAL_USERS[0])));
                }
                if (state.currentUser) {
                    const updatedMe = state.users.find(u => u.username.toLowerCase() === state.currentUser.username.toLowerCase());
                    if (updatedMe) state.currentUser = updatedMe;
                }
            }
            if (data.initialized) {
                if (typeof data.isSchedulePublished === 'boolean') {
                    state.isSchedulePublished = data.isSchedulePublished;
                }
                if (data.settings && typeof data.settings === 'object') {
                    state.settings = Object.assign(createDefaultSettings(), data.settings);
                }
                if (Array.isArray(data.subjects)) {
                    state.subjects = data.subjects;
                }
            }
            // บันทึกสำเนาลง localStorage โดยไม่ยิงซิงค์วนกลับ
            saveState(null);
        }

        async function syncFromCloud(silent = false) {
            if (!isCloudEnabled()) return false;
            setCloudStatus('syncing', 'กำลังโหลด...');
            try {
                const res = await cloudRequest('getData');
                if (res && res.status === 'ok' && res.data) {
                    applyCloudDataToState(res.data);
                    setCloudStatus('synced', 'ซิงค์ Sheets แล้ว');
                    render();
                    if (!silent) showToast('ดึงข้อมูลล่าสุดจาก Google Sheets เรียบร้อยแล้ว', 'success');
                    return true;
                }
                throw new Error(res?.message || 'รูปแบบข้อมูลตอบกลับไม่ถูกต้อง');
            } catch (err) {
                console.warn('Cloud Load Error:', err);
                setCloudStatus('error', 'เชื่อมต่อไม่สำเร็จ');
                if (!silent) showToast('ไม่สามารถดึงข้อมูลจาก Google Sheets ได้ กรุณาตรวจสอบลิงก์และสิทธิ์ Web App', 'error');
                return false;
            }
        }

        async function syncSaveToCloud(action, payload) {
            if (!isCloudEnabled()) return;
            setCloudStatus('syncing', 'กำลังบันทึก...');
            try {
                let reqPayload = payload;
                if (action === 'saveAll' && !reqPayload) {
                    reqPayload = {
                        data: {
                            isSchedulePublished: state.isSchedulePublished,
                            settings: state.settings,
                            users: state.users,
                            subjects: state.subjects
                        }
                    };
                }
                const res = await cloudRequest(action, reqPayload);
                if (res && res.status === 'ok') {
                    if (action === 'addSubject' && res.data && Array.isArray(res.data.subjects)) {
                        state.subjects = res.data.subjects;
                        saveState(null);
                        render();
                    }
                    setCloudStatus('synced', 'บันทึกบน Sheets แล้ว');
                } else {
                    throw new Error(res?.message || 'บันทึกไม่สำเร็จ');
                }
            } catch (err) {
                console.warn('Cloud Save Error:', err);
                setCloudStatus('error', 'บันทึกคลาวด์ไม่สำเร็จ');
                showToast('บันทึกในเครื่องแล้ว แต่ซิงค์ขึ้น Google Sheets ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตหรือสิทธิ์ Web App', 'warning');
            }
        }

        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const styles = {
                success: 'bg-emerald-600 text-white border-emerald-700',
                error: 'bg-red-600 text-white border-red-700',
                warning: 'bg-amber-500 text-white border-amber-600',
                info: 'bg-slate-800 text-white border-slate-900'
            };
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                warning: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast-enter pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-medium ${styles[type] || styles.info}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info} mt-0.5 flex-shrink-0"></i>
                <span class="leading-snug">${escapeHtml(message)}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.transition = 'opacity 0.25s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 260);
            }, 3400);
        }

        function formatMinutesToTime(totalMin) {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return `${String(h).padStart(2, '0')}.${String(m).padStart(2, '0')}`;
        }

        function getSlotLabel(slotId, duration) {
            const slot = TIME_SLOTS.find(s => s.id === slotId);
            if (!slot) return '';
            if (slot.period === 'lunch') return slot.label;
            const dur = Number(duration);
            if (dur && dur > 0 && slot.startMin) {
                const startText = formatMinutesToTime(slot.startMin);
                const endText = formatMinutesToTime(slot.startMin + dur);
                return `${startText}-${endText} น.`;
            }
            return slot.label;
        }

        function getUserDepartmentByName(teacherName) {
            if (!teacherName) return '';
            const clean = teacherName.trim();
            const foundUser = state.users.find(u => u.name.trim() === clean);
            if (foundUser && foundUser.department) return foundUser.department;
            // Fallback: check existing subjects
            for (const sub of state.subjects) {
                const foundT = (sub.teachers || []).find(t => t.name.trim() === clean && t.department);
                if (foundT) return foundT.department;
            }
            return '';
        }

        function formatTeachersDisplay(teachers, includeDept = false) {
            return (teachers || []).map(t => {
                const roomsText = t.rooms ? ` (${t.rooms})` : '';
                const dept = t.department || getUserDepartmentByName(t.name);
                const deptText = includeDept && dept ? ` [${dept}]` : '';
                return `${t.name}${roomsText}${deptText}`;
            }).join('  ');
        }

        function downloadCSV(filename, headers, rows) {
            const escapeCsv = (val) => {
                const s = String(val === null || val === undefined ? '' : val);
                return `"${s.replace(/"/g, '""')}"`;
            };
            const csvLines = [
                headers.map(escapeCsv).join(','),
                ...rows.map(r => r.map(escapeCsv).join(','))
            ];
            const blob = new Blob(['\uFEFF' + csvLines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            URL.revokeObjectURL(url);
            showToast(`ส่งออกไฟล์ ${filename} เรียบร้อยแล้ว`, 'success');
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '"' && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        current += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
            }
            result.push(current.trim());
            return result;
        }

        function checkDuplicateSubjectCode() {
            const gradeEl = document.getElementById('f-grade');
            const codeEl = document.getElementById('f-code');
            const nameEl = document.getElementById('f-name');
            const durEl = document.getElementById('f-duration');
            const alertBox = document.getElementById('merge-alert-box');
            const alertText = document.getElementById('merge-alert-text');
            if (!gradeEl || !codeEl || !alertBox) return;

            const gradeId = gradeEl.value;
            const code = codeEl.value.trim();
            if (!code) {
                alertBox.classList.add('hidden');
                return;
            }

            const existing = state.subjects.find(
                s => s.gradeId === gradeId && s.code.toLowerCase() === code.toLowerCase()
            );

            if (existing) {
                alertBox.classList.remove('hidden');
                alertText.innerHTML = `พบวิชา <strong>${escapeHtml(existing.code)} ${escapeHtml(existing.name)}</strong> ในระดับชั้นนี้แล้ว (มีครูผู้สอน ${existing.teachers.length} คน) — เมื่อกดบันทึก ระบบจะนำชื่อครูไป <strong>สอบรวมกันในวันและเวลาเดียวกันทันที</strong>`;
                if (nameEl && !nameEl.value.trim()) nameEl.value = existing.name;
                if (durEl) durEl.value = String(existing.duration);
            } else {
                alertBox.classList.add('hidden');
            }
        }

        function handleAddSubject(e) {
            e.preventDefault();
            const gradeId = document.getElementById('f-grade').value;
            const code = document.getElementById('f-code').value.trim();
            const name = document.getElementById('f-name').value.trim();
            const duration = parseInt(document.getElementById('f-duration').value, 10) || 60;
            const teacherName = document.getElementById('f-teacher').value.trim();
            const rooms = document.getElementById('f-rooms').value.trim();

            if (!code || !name || !teacherName) {
                showToast('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน', 'warning');
                return;
            }

            const existing = state.subjects.find(
                s => s.gradeId === gradeId && s.code.toLowerCase() === code.toLowerCase()
            );
            const teacherDept = getUserDepartmentByName(teacherName) || state.currentUser?.department || '';
            const newId = 'sub_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const teacherObj = { name: teacherName, rooms, department: teacherDept };

            if (existing) {
                existing.teachers.push(teacherObj);
                showToast(`รวมครู ${teacherName} เข้าสอบพร้อมวิชา ${existing.code} เรียบร้อยแล้ว`, 'success');
            } else {
                state.subjects.push({
                    id: newId,
                    gradeId,
                    code,
                    name,
                    duration,
                    teachers: [teacherObj],
                    dayIndex: null,
                    slotId: null
                });
                showToast(`เพิ่มรายวิชา ${code} ${name} เรียบร้อยแล้ว`, 'success');
            }

            // ใช้โหมด addSubject แบบ Atomic เพื่อให้ครูหลายคนส่งข้อมูลพร้อมกันได้โดยไม่ทับกัน
            saveState('addSubject', {
                subject: {
                    id: newId,
                    gradeId,
                    code,
                    name,
                    duration,
                    teacher: teacherObj
                }
            });
            render();
        }

        function removeTeacherFromSubject(subjectId, teacherIdx) {
            const sub = state.subjects.find(s => s.id === subjectId);
            if (!sub) return;
            const targetTeacher = sub.teachers[teacherIdx];
            if (!targetTeacher) return;

            openConfirmModal(
                'ลบชื่อครูผู้สอน',
                `ต้องการลบ "${targetTeacher.name}" ออกจากรายวิชา ${sub.code} ${sub.name} ใช่หรือไม่?` +
                (sub.teachers.length <= 1 ? ' (หากเป็นครูท่านสุดท้าย รายวิชานี้จะถูกลบออกด้วย)' : ''),
                () => {
                    sub.teachers.splice(teacherIdx, 1);
                    if (sub.teachers.length === 0) {
                        state.subjects = state.subjects.filter(s => s.id !== subjectId);
                    }
                    saveState();
                    showToast('ลบข้อมูลเรียบร้อยแล้ว', 'info');
                    render();
                }
            );
        }

        function confirmDeleteSubject(subjectId) {
            const sub = state.subjects.find(s => s.id === subjectId);
            if (!sub) return;
            openConfirmModal(
                'ลบรายวิชาสอบ',
                `ต้องการลบรายวิชา ${sub.code} ${sub.name} ออกจากระบบทั้งหมดใช่หรือไม่?`,
                () => {
                    state.subjects = state.subjects.filter(s => s.id !== subjectId);
                    saveState();
                    showToast(`ลบรายวิชา ${sub.code} เรียบร้อยแล้ว`, 'info');
                    render();
                }
            );
        }

                const unCount = state.subjects.filter(s => s.gradeId === g.id && (s.dayIndex === null || s.slotId === null)).length;
                return `
                    <button type="button" onclick="state.selectedAdminGrade='${g.id}'; render();"
                        class="px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${state.selectedAdminGrade === g.id ? 'theme-btn border-transparent shadow-sm' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'}">
                        <span>${g.short}</span>
                        ${unCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] ${state.selectedAdminGrade === g.id ? 'bg-white/25 text-white' : 'bg-amber-100 text-amber-700'}">${unCount}</span>` : ''}
                    </button>
                `;
            }).join('');

            const upperGradeBtns = GRADE_GROUPS.filter(g => g.level === 'upper').map(g => {
                const unCount = state.subjects.filter(s => s.gradeId === g.id && (s.dayIndex === null || s.slotId === null)).length;
                return `
                    <button type="button" onclick="state.selectedAdminGrade='${g.id}'; render();"
                        class="px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${state.selectedAdminGrade === g.id ? 'theme-btn border-transparent shadow-sm' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'}">
                        <span>${g.short}</span>
                        ${unCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] ${state.selectedAdminGrade === g.id ? 'bg-white/25 text-white' : 'bg-amber-100 text-amber-700'}">${unCount}</span>` : ''}
                    </button>
                `;
            }).join('');

            const unscheduledHtml = unscheduled.length > 0
                ? unscheduled.map(sub => `
                    <div draggable="true" ondragstart="handleDragStart(event, '${sub.id}')" onclick="openSlotModal('${sub.id}')"
                        class="draggable p-3 rounded-xl bg-amber-50/90 border border-amber-200 hover:border-amber-400 shadow-sm transition cursor-pointer">
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-bold text-xs text-amber-900">${escapeHtml(sub.code)}</span>
                            <span class="px-1.5 py-0.5 rounded bg-white text-[10px] font-bold text-amber-700 border border-amber-200">${sub.duration} น.</span>

        function togglePublishSchedule() {
            state.isSchedulePublished = !state.isSchedulePublished;
            saveState();
            showToast(
                state.isSchedulePublished ? 'เปิดแสดงตารางสอบให้ครูเรียบร้อยแล้ว' : 'ปิดการแสดงตารางสอบชั่วคราวแล้ว',
                state.isSchedulePublished ? 'success' : 'warning'
            );
            render();
        }

        function autoScheduleGrade(gradeId, silent = false) {
            const grade = getGradeObj(gradeId);
            const days = getDaysForGrade(gradeId);
            const validSlots = TIME_SLOTS.filter(s => s.period !== 'lunch');
            const gradeSubjects = state.subjects.filter(s => s.gradeId === gradeId);
            const unscheduled = gradeSubjects.filter(s => s.dayIndex === null || s.slotId === null);

            if (unscheduled.length === 0) {
                if (!silent) showToast(`ชั้น ${grade.short} จัดตารางครบทุกวิชาแล้ว`, 'info');
                return 0;
            }

            let count = 0;
            unscheduled.forEach(sub => {
                // First, check if the exact same subject code is already scheduled in a sibling grade (same level)
                const siblingScheduled = state.subjects.find(
                    other => other.id !== sub.id &&
                        other.code.toLowerCase() === sub.code.toLowerCase() &&
                        getGradeObj(other.gradeId).level === grade.level &&
                        other.dayIndex !== null && other.slotId !== null
                );

                if (siblingScheduled) {
                    const slotOccupied = gradeSubjects.some(
                        s => s.dayIndex === siblingScheduled.dayIndex && s.slotId === siblingScheduled.slotId
                    );
                    if (!slotOccupied && siblingScheduled.dayIndex < days.length) {
                        sub.dayIndex = siblingScheduled.dayIndex;
                        sub.slotId = siblingScheduled.slotId;
                        count++;
                        return;
                    }
                }

                // Otherwise pick the first available slot balancing across days
                let placed = false;
                for (let sIdx = 0; sIdx < validSlots.length && !placed; sIdx++) {
                    for (let dIdx = 0; dIdx < days.length && !placed; dIdx++) {
                        const slotId = validSlots[sIdx].id;
                        const occupied = gradeSubjects.some(s => s.dayIndex === dIdx && s.slotId === slotId);
                        if (!occupied) {
                            sub.dayIndex = dIdx;
                            sub.slotId = slotId;
                            placed = true;
                            count++;
                        }
                    }
                }

                // Fallback: if all slots are full, put in last slot of last day
                if (!placed) {
                    sub.dayIndex = days.length - 1;
                    sub.slotId = validSlots[validSlots.length - 1].id;
                    count++;
                }
            });

            saveState();
            if (!silent) {
                showToast(`จัดตารางอัตโนมัติชั้น ${grade.short} สำเร็จ ${count} รายวิชา`, 'success');
                render();
            }
            return count;
        }

        function autoScheduleAll() {
            let total = 0;
            GRADE_GROUPS.forEach(g => {
                total += autoScheduleGrade(g.id, true);
            });
            saveState();
            if (total > 0) {
                showToast(`จัดตารางสอบอัตโนมัติทุกชั้นเรียบร้อยแล้ว (${total} รายวิชา)`, 'success');
            } else {
                showToast('ทุกระดับชั้นจัดตารางครบถ้วนแล้ว', 'info');
            }
            render();
        }

        function confirmClearGradeSchedule(gradeId) {
            const grade = getGradeObj(gradeId);
            openConfirmModal(
                'ล้างตารางสอบชั้นนี้',
                `ต้องการนำรายวิชาทั้งหมดของ ${grade.name} ออกจากช่องเวลาสอบกลับไปที่ช่อง "วิชารอจัดตาราง" ใช่หรือไม่?`,
                () => {
                    state.subjects.forEach(s => {
                        if (s.gradeId === gradeId) {
                            s.dayIndex = null;
                            s.slotId = null;
                        }
                    });
                    saveState();
                    showToast(`ล้างตารางสอบ ${grade.short} เรียบร้อยแล้ว`, 'info');
                    render();
                }
            );
        }

        // Drag & Drop Handlers
        function handleDragStart(e, subjectId) {
            e.dataTransfer.setData('text/plain', subjectId);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('dragover');
        }

        function handleDropOnSlot(e, dayIndex, slotId) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const subjectId = e.dataTransfer.getData('text/plain');
            if (!subjectId) return;
            assignSubjectToSlot(subjectId, dayIndex, slotId);
        }

        function handleDropOnUnscheduled(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const subjectId = e.dataTransfer.getData('text/plain');
            if (!subjectId) return;
            const sub = state.subjects.find(s => s.id === subjectId);
            if (!sub) return;
            sub.dayIndex = null;
            sub.slotId = null;
            saveState();
            showToast(`นำวิชา ${sub.code} ออกจากตารางแล้ว`, 'info');
            render();
        }

        // Touch / Click Slot Modal Handlers
        function openSlotModal(subjectId) {
            const sub = state.subjects.find(s => s.id === subjectId);
            if (!sub) return;
            state.modalSubjectId = subjectId;

            const days = getDaysForGrade(sub.gradeId);
            const validSlots = TIME_SLOTS.filter(s => s.period !== 'lunch');
            const gradeSubjects = state.subjects.filter(s => s.gradeId === sub.gradeId);

            document.getElementById('slot-modal-subject-info').textContent = `${sub.code} ${sub.name} (${sub.duration} นาที)`;
            const unschedBtn = document.getElementById('slot-modal-unschedule-btn');
            if (sub.dayIndex !== null && sub.slotId !== null) {
                unschedBtn.classList.remove('hidden');
            } else {
                unschedBtn.classList.add('hidden');
            }

            const bodyHtml = days.map((dayLabel, dIdx) => {
                const btns = validSlots.map(slot => {
                    const isCurrent = sub.dayIndex === dIdx && sub.slotId === slot.id;
                    const others = gradeSubjects.filter(s => s.id !== sub.id && s.dayIndex === dIdx && s.slotId === slot.id);
                    const occText = others.length > 0 ? `มี ${others.map(o => o.code).join(', ')}` : 'ว่าง';
                    return `
                        <button type="button" onclick="assignSubjectToSlot('${sub.id}', ${dIdx}, '${slot.id}'); closeSlotModal();"
                            class="p-2.5 rounded-xl border text-left transition ${isCurrent ? 'theme-btn border-transparent shadow-sm' : 'bg-white border-gray-200 hover:border-blue-400 hover:bg-blue-50/40'}">
                            <div class="text-xs font-bold">${slot.label}</div>
                            <div class="text-[10px] mt-0.5 ${isCurrent ? 'text-white/90' : (others.length > 0 ? 'text-amber-600 font-semibold' : 'text-emerald-600')}">
                                ${isCurrent ? 'ตำแหน่งปัจจุบัน' : occText}
                            </div>
                        </button>
                    `;
                }).join('');

                return `
                    <div>
                        <div class="text-xs font-bold text-gray-700 mb-2 flex items-center gap-1.5">
                            <i class="fas fa-calendar-day theme-text"></i> ${escapeHtml(dayLabel)}
                        </div>
                        <div class="grid grid-cols-2 gap-2">${btns}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('slot-modal-body').innerHTML = bodyHtml;
            const modal = document.getElementById('slot-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeSlotModal() {
            const modal = document.getElementById('slot-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            state.modalSubjectId = null;
        }

        function assignSubjectToSlot(subjectId, dayIndex, slotId) {
            const sub = state.subjects.find(s => s.id === subjectId);
            if (!sub) return;
            sub.dayIndex = dayIndex;
            sub.slotId = slotId;
            saveState();
            const days = getDaysForGrade(sub.gradeId);
            showToast(`ย้ายวิชา ${sub.code} ไปที่ ${days[dayIndex]} (${getSlotLabel(slotId, sub.duration)})`, 'success');
            render();
        }

        function unscheduleModalSubject() {
            if (!state.modalSubjectId) return;
            const sub = state.subjects.find(s => s.id === state.modalSubjectId);
            if (sub) {
                sub.dayIndex = null;
                sub.slotId = null;
                saveState();
                showToast(`นำวิชา ${sub.code} ออกจากตารางแล้ว`, 'info');
            }
            closeSlotModal();
            render();
        }

        function renderGradeExportView() {
            const filterOptions = `<option value="all">แสดงทุกระดับชั้น (${GRADE_GROUPS.length} ตาราง)</option>` +

            const targetGrades = state.exportFilterGrade === 'all'
                ? GRADE_GROUPS
                : GRADE_GROUPS.filter(g => g.id === state.exportFilterGrade);

            const sectionsHtml = targetGrades.map(grade => {
                const days = getDaysForGrade(grade.id);
                const gradeSubjects = state.subjects.filter(s => s.gradeId === grade.id && s.dayIndex !== null && s.slotId !== null);
                const sectionId = `grade-sec-${grade.id}`;

                const dayTablesHtml = days.map((dayLabel, dIdx) => {
                    const daySubjects = gradeSubjects.filter(s => s.dayIndex === dIdx);
                    if (daySubjects.length === 0) return '';

                    const rows = [];
                    let hasMorning = false;
                    let hasAfternoon = false;

                    TIME_SLOTS.forEach(slot => {
                        if (slot.period === 'lunch') {
                            rows.push({ isLunch: true, label: slot.label });
                            return;
                        }
                        const slotSubs = daySubjects.filter(s => s.slotId === slot.id);
                        slotSubs.forEach((sub, idx) => {
                            if (slot.period === 'morning') hasMorning = true;
                            if (slot.period === 'afternoon') hasAfternoon = true;
                            rows.push({
                                isLunch: false,
                                showTime: idx === 0,
                                timeText: getSlotLabel(slot.id, sub.duration),
                                code: sub.code,
                                name: sub.name,
                                duration: `${sub.duration} นาที`,
                                teachers: formatTeachersDisplay(sub.teachers)
                            });
                        });
                    });

                    // Filter out lunch row if there are no afternoon subjects
                    const cleanRows = rows.filter(r => !r.isLunch || (hasMorning && hasAfternoon));
                    const totalRows = cleanRows.length;

                    const trHtml = cleanRows.map((r, rIdx) => {
                        const dayCell = rIdx === 0
                            ? `<td rowspan="${totalRows}" class="border border-gray-800 p-2 text-center doc-bold align-middle w-[115px] bg-white">${escapeHtml(dayLabel)}</td>`
                            : '';
                        if (r.isLunch) {
                            return `
                                <tr class="lunch-row bg-gray-50">
                                    ${dayCell}
                                    <td colspan="5" class="border border-gray-800 p-2 text-center doc-bold">${escapeHtml(r.label)}</td>
                                </tr>
                            `;
                        }
                        return `
                            <tr>
                                ${dayCell}
                                <td class="border border-gray-800 p-2 text-center whitespace-nowrap">${r.showTime ? escapeHtml(r.timeText) : ''}</td>
                                <td class="border border-gray-800 p-2 text-center whitespace-nowrap doc-bold">${escapeHtml(r.code)}</td>
                                <td class="border border-gray-800 p-2">${escapeHtml(r.name)}</td>
                                <td class="border border-gray-800 p-2 text-center whitespace-nowrap">${escapeHtml(r.duration)}</td>
                                <td class="border border-gray-800 p-2">${escapeHtml(r.teachers)}</td>
                            </tr>
                        `;
                    }).join('');

                    return `
                        <div class="overflow-x-auto mb-4 last:mb-0">
                            <table class="w-full border-collapse border border-gray-800">
                                <thead>
                                    <tr class="bg-gray-100 text-center">
                                        <th class="border border-gray-800 p-2 w-[115px]">วัน/เดือน/ปี</th>
                                        <th class="border border-gray-800 p-2 w-[115px]">เวลา</th>
                                        <th class="border border-gray-800 p-2 w-[90px]">รหัสวิชา</th>
                                        <th class="border border-gray-800 p-2">รายวิชา</th>
                                        <th class="border border-gray-800 p-2 w-[80px]">ระยะเวลา</th>
                                        <th class="border border-gray-800 p-2">ครูผู้สอน</th>
                                    </tr>
                                </thead>
                                <tbody>${trHtml}</tbody>
                            </table>
                        </div>
                    `;
                }).filter(Boolean).join('');

                return `
                    <div id="${sectionId}" class="printable-section page-break bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sm:p-6 print-card export-doc-area">
                        <div class="flex flex-wrap items-center justify-end gap-2 mb-3 no-print no-capture">

                                <i class="fas fa-image"></i> บันทึกรูปภาพ (PNG)
                            </button>
                            <button type="button" onclick="printSingleSection('${sectionId}')"
                                class="px-3.5 py-2 rounded-xl text-xs font-bold bg-gray-800 hover:bg-gray-900 text-white shadow-sm transition flex items-center gap-1.5">
                                <i class="fas fa-file-pdf"></i> บันทึก PDF / พิมพ์ชั้นนี้
                            </button>
                        </div>
                        ${getScheduleHeaderHtml(grade.name)}
                        ${dayTablesHtml || `<div class="p-8 text-center text-sm text-gray-400 border border-dashed border-gray-300 rounded-xl">ยังไม่มีรายวิชาที่จัดลงตารางสอบในระดับชั้นนี้</div>`}
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-5">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3.5 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 no-print">
                        <span class="text-xs sm:text-sm font-bold text-gray-700"><i class="fas fa-filter theme-text mr-1.5"></i>เลือกระดับชั้นที่ต้องการดู / บันทึก</span>
                        <select onchange="state.exportFilterGrade=this.value; render();" class="border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm bg-white outline-none">
                            ${filterOptions}

        }

        function getTeacherScheduleMap() {
            const map = new Map();
            state.subjects.forEach(sub => {
                const grade = getGradeObj(sub.gradeId);
                const days = getDaysForGrade(sub.gradeId);
                const dayText = sub.dayIndex !== null ? (days[sub.dayIndex] || '-') : 'ยังไม่จัดวัน';
                const timeText = sub.slotId ? getSlotLabel(sub.slotId, sub.duration) : 'ยังไม่จัดเวลา';
                const slotOrder = TIME_SLOTS.findIndex(s => s.id === sub.slotId);

                (sub.teachers || []).forEach(t => {
                    const tName = t.name.trim();
                    if (!tName) return;
                    if (!map.has(tName)) map.set(tName, []);
                    map.get(tName).push({
                        gradeName: grade.name,
                        gradeShort: grade.short,
                        dayText,
                        dayIndex: sub.dayIndex === null ? 99 : sub.dayIndex,
                        timeText,
                        slotOrder: slotOrder === -1 ? 99 : slotOrder,
                        code: sub.code,
                        name: sub.name,
                        duration: sub.duration,
                        rooms: t.rooms || '-',
                        coTeachersCount: sub.teachers.length
                    });
                });
            });

            // Sort each teacher's rows by day & time
            map.forEach(items => {
                items.sort((a, b) => (a.dayIndex - b.dayIndex) || (a.slotOrder - b.slotOrder));
            });
            return map;
        }

        // High-Res PNG Export (renders off-screen at 960px desktop width so mobile never squishes table)
        async function downloadSectionAsPNG(sectionId, filenameBase) {
            const sourceEl = document.getElementById(sectionId);
            const stage = document.getElementById('png-export-stage');
            if (!sourceEl || !stage) return;

            if (typeof html2canvas !== 'function') {
                showToast('ไม่สามารถโหลดตัวสร้างรูปภาพได้ กรุณาลองใหม่', 'error');
                return;
            }

            try {
                showToast('กำลังสร้างรูปภาพความละเอียดสูง...', 'info');
                stage.innerHTML = '';
                const clone = sourceEl.cloneNode(true);
                clone.id = 'png-clone-temp';
                clone.classList.add('capturing-png', 'export-doc-area');
                clone.style.boxShadow = 'none';
                clone.style.border = 'none';
                clone.querySelectorAll('.no-print, .no-capture, button').forEach(el => el.remove());
                clone.querySelectorAll('.overflow-x-auto').forEach(el => {
                    el.style.overflow = 'visible';
                });
                stage.appendChild(clone);

                const canvas = await html2canvas(stage, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `${filenameBase}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                stage.innerHTML = '';
                showToast(`บันทึกรูปภาพ ${filenameBase}.png เรียบร้อยแล้ว`, 'success');
            } catch (err) {
                console.error('PNG Export Error:', err);
                stage.innerHTML = '';
                showToast('เกิดข้อผิดพลาดในการสร้างรูปภาพ', 'error');
            }
        }

        function printSingleSection(sectionId) {
            document.querySelectorAll('.printable-section').forEach(el => el.classList.remove('print-target'));
            const target = document.getElementById(sectionId);
            if (!target) return;
            target.classList.add('print-target');
            document.body.classList.add('printing-single');
            window.print();
            setTimeout(() => {
                document.body.classList.remove('printing-single');
                target.classList.remove('print-target');
            }, 500);
        }

        function printAllSections() {
            document.body.classList.remove('printing-single');
            window.print();
        }

        // Microsoft Word (.doc) Export
        function buildWordDocumentHtml(innerHtmlContent) {
            const fontObj = EXPORT_FONTS.find(f => f.value === state.settings.exportFont) || EXPORT_FONTS[0];

            const fontWeight = state.settings.exportFontWeight || '400';

            return `
                <html xmlns:o="urn:schemas-microsoft-com:office:office"
                      xmlns:w="urn:schemas-microsoft-com:office:word"
                      xmlns="http://www.w3.org/TR/REC-html40">

                    <meta charset="utf-8">
                    <title>${escapeHtml(getExamMainTitle())}</title>

                            color: ${textColor};
                            font-weight: ${fontWeight};

                            object-fit: contain;
                        }
                    </style>
                </head>
                <body>
                    ${innerHtmlContent}
                </body>
                </html>
            `;
        }

        function triggerWordDownload(filenameBase, htmlBody) {
            const docHtml = buildWordDocumentHtml(htmlBody);
            const blob = new Blob(['\uFEFF' + docHtml], { type: 'application/msword;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${filenameBase}.doc`;
            link.click();
            URL.revokeObjectURL(url);
            showToast(`ดาวน์โหลดไฟล์ ${filenameBase}.doc เรียบร้อยแล้ว`, 'success');
        }

        function exportSectionAsWordDoc(sectionId, filenameBase) {
            const sourceEl = document.getElementById(sectionId);
            if (!sourceEl) return;
            const clone = sourceEl.cloneNode(true);
            clone.querySelectorAll('.no-print, .no-capture, button').forEach(el => el.remove());
            triggerWordDownload(filenameBase, clone.innerHTML);
        }

        function exportAllAsWordDoc() {
            const sections = Array.from(document.querySelectorAll('.printable-section'));
            if (sections.length === 0) {
                showToast('ไม่พบข้อมูลตารางสำหรับส่งออก', 'warning');
                return;
            }
            const combinedHtml = sections.map((sec, idx) => {
                const clone = sec.cloneNode(true);
                clone.querySelectorAll('.no-print, .no-capture, button').forEach(el => el.remove());
                const pageBreak = idx < sections.length - 1 ? '<br clear="all" style="page-break-before:always" />' : '';
                return `<div>${clone.innerHTML}</div>${pageBreak}`;
            }).join('');

            triggerWordDownload(`ตารางสอบ${state.settings.examType}_ทั้งหมด`, combinedHtml);
        }

        function exportCurrentModeCSV() {
            if (state.exportMode === 'teacher') {
                const teacherMap = getTeacherScheduleMap();
                const headers = ['ครูผู้สอน', 'กลุ่มสาระการเรียนรู้', 'วันสอบ', 'เวลาสอบ', 'ระดับชั้น', 'รหัสวิชา', 'รายวิชา', 'ระยะเวลา(นาที)', 'ห้องที่สอน'];
                const rows = [];
                teacherMap.forEach((items, tName) => {
                    if (state.exportFilterTeacher !== 'all' && state.exportFilterTeacher !== tName) return;
                    const dept = getUserDepartmentByName(tName);
                    items.forEach(it => {
                        rows.push([tName, dept, it.dayText, it.timeText, it.gradeName, it.code, it.name, it.duration, it.rooms]);
                    });
                });
                downloadCSV(`ตารางสอบ${state.settings.examType}_แยกครูผู้สอน.csv`, headers, rows);
                return;
            }

            const headers = ['ระดับชั้น', 'วันสอบ', 'เวลาสอบ', 'รหัสวิชา', 'รายวิชา', 'ระยะเวลา(นาที)', 'ครูผู้สอน'];
            const rows = [];
            state.subjects.forEach(sub => {
                if (state.exportMode === 'grade' && state.exportFilterGrade !== 'all' && sub.gradeId !== state.exportFilterGrade) return;
                if (state.exportMode === 'subject' && state.exportFilterSubject !== 'all' && sub.code !== state.exportFilterSubject) return;
                const grade = getGradeObj(sub.gradeId);
                const days = getDaysForGrade(sub.gradeId);
                const dayText = sub.dayIndex !== null ? (days[sub.dayIndex] || '-') : 'ยังไม่จัดวัน';
                const timeText = sub.slotId ? getSlotLabel(sub.slotId, sub.duration) : 'ยังไม่จัดเวลา';
                rows.push([grade.name, dayText, timeText, sub.code, sub.name, sub.duration, formatTeachersDisplay(sub.teachers)]);
            });
            downloadCSV(`ตารางสอบ${state.settings.examType}.csv`, headers, rows);
        }

        function handleLogoUpload(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            if (file.size > 3000000) {
                showToast('ไฟล์รูปภาพมีขนาดใหญ่เกิน 3MB กรุณาเลือกไฟล์ขนาดเล็กลง', 'warning');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // ย่อขนาดอัตโนมัติไม่เกิน 220px เพื่อเก็บใน Google Sheets ได้อย่างปลอดภัย
                    const maxDim = 220;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w >= h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    state.settings.logoDataUrl = canvas.toDataURL('image/png');
                    saveState();
                    showToast('อัปโหลดตราโรงเรียนเรียบร้อยแล้ว', 'success');
                    render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleSaveEditedUser(e) {
            e.preventDefault();
            if (!state.editingUserId) return;
            const user = state.users.find(u => u.id === state.editingUserId);
            if (!user) return;

            const isMainAdmin = user.username === 'krunoon';
            const newUsername = isMainAdmin ? 'krunoon' : document.getElementById('edit-u-username').value.trim();
            const newPassword = document.getElementById('edit-u-password').value.trim();
            const newName = document.getElementById('edit-u-name').value.trim();
            const newDept = document.getElementById('edit-u-dept').value.trim() || 'ไม่ระบุกลุ่มสาระ';
            const newRole = isMainAdmin ? 'admin' : document.getElementById('edit-u-role').value;

            if (!newUsername || !newPassword || !newName) {
                showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
                return;
            }

            const duplicate = state.users.some(
                u => u.id !== user.id && u.username.toLowerCase() === newUsername.toLowerCase()
            );
            if (duplicate) {
                showToast(`Username "${newUsername}" ซ้ำกับผู้ใช้อื่นในระบบ`, 'error');
                return;
            }

            const oldName = user.name;
            user.username = newUsername;
            user.password = newPassword;
            user.name = newName;
            user.department = newDept;
            user.role = newRole;

            // Sync updated teacher name & department into any already-submitted exam subjects
            state.subjects.forEach(sub => {
                (sub.teachers || []).forEach(t => {
                    if (t.name.trim() === oldName.trim()) {
                        t.name = newName;
                        t.department = newDept;
                    }
                });
            });

            // Keep currently logged-in session updated if admin edited their own profile
            if (state.currentUser && state.currentUser.id === user.id) {
                state.currentUser = user;
            }

            saveState();
            closeEditUserModal();
            showToast(`บันทึกการแก้ไขข้อมูล "${newName}" เรียบร้อยแล้ว`, 'success');

        }

        async function syncUsersFromGoogleSheet() {
            const input = document.getElementById('sheet-url-input');
            const rawUrl = (input ? input.value.trim() : '') || state.settings.sheetUrl;
            state.settings.sheetUrl = rawUrl;
            saveState();

            const matchId = rawUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (!matchId) {
                showToast('รูปแบบลิงก์ Google Sheets ไม่ถูกต้อง', 'error');
                return;
            }
            const sheetId = matchId[1];
            const gidMatch = rawUrl.match(/gid=([0-9]+)/);
            const gid = gidMatch ? gidMatch[1] : '0';
            const exportCsvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;

            try {
                showToast('กำลังเชื่อมต่อดึงข้อมูลจาก Google Sheets...', 'info');
                const res = await fetch(exportCsvUrl);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                if (text.trim().startsWith('<!DOCTYPE') || text.includes('<html')) {
                    throw new Error('Sheet is private');
                }
                const { added, updated } = parseUsersFromCSVText(text);
                saveState();
                showToast(`ซิงค์สำเร็จ: เพิ่มใหม่ ${added} คน, อัปเดต ${updated} คน`, 'success');
                render();
            } catch (err) {
                console.warn('Google Sheets Sync Error:', err);
                showToast('ไม่สามารถดึงตรงจาก Google Sheets ได้ (โปรดตั้งค่าแชร์เป็นสาธารณะ หรือใช้ปุ่มนำเข้าไฟล์ CSV แทน)', 'warning');
            }
        }

        function importUsersCSV(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const { added, updated } = parseUsersFromCSVText(e.target.result || '');
                saveState();
                showToast(`นำเข้า CSV สำเร็จ: เพิ่มใหม่ ${added} คน, อัปเดต ${updated} คน`, 'success');
                render();
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function parseUsersFromCSVText(csvText) {
            const cleaned = csvText.replace(/^\uFEFF/, '');
            const lines = cleaned.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            let added = 0;
            let updated = 0;

            lines.forEach((line, idx) => {
                const cols = parseCSVLine(line);
                if (cols.length < 2) return;

                const firstLower = cols[0].toLowerCase();
                if (idx === 0 && (firstLower.includes('user') || firstLower.includes('ชื่อผู้ใช้') || firstLower.includes('รหัสผู้ใช้') || firstLower.includes('ลำดับ'))) {
                    return;
                }

                let username = cols[0];
                let password = cols[1];
                let name = cols[2] || cols[0];
                let department = 'ไม่ระบุกลุ่มสาระ';
                let role = 'teacher';

                if (cols.length >= 5) {
                    // Format: username, password, name, department, role
                    department = cols[3] || 'ไม่ระบุกลุ่มสาระ';
                    const rLower = (cols[4] || '').toLowerCase();
                    role = (rLower.includes('admin') || rLower.includes('แอดมิน')) ? 'admin' : 'teacher';
                } else if (cols.length === 4) {
                    const col4Lower = (cols[3] || '').toLowerCase();
                    if (col4Lower === 'admin' || col4Lower === 'teacher' || col4Lower === 'แอดมิน' || col4Lower === 'ครู') {
                        role = (col4Lower === 'admin' || col4Lower === 'แอดมิน') ? 'admin' : 'teacher';
                    } else {
                        department = cols[3] || 'ไม่ระบุกลุ่มสาระ';
                    }
                }

                if (!username || !password) return;
                const existing = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
                if (existing) {
                    if (existing.username !== 'krunoon') {
                        existing.password = password;
                        existing.name = name;
                        existing.department = department;
                        existing.role = role;
                        updated++;
                    }
                } else {
                    state.users.push({
                        id: 'u_imp_' + Date.now() + '_' + idx,
                        username,
                        password,
                        name,
                        department,
                        role
                    });
                    added++;
                }
            });
            return { added, updated };
        }

        function exportUsersCSV() {
            const headers = ['username', 'password', 'name', 'department', 'role'];

                    state.isSchedulePublished = true;
                    applyTheme();
                    showToast('รีเซ็ตข้อมูลกลับเป็นค่าเริ่มต้นเรียบร้อยแล้ว', 'success');
                    render();
                }
            );
        }

        // ==========================================
        // 9. MAIN RENDER & INITIALIZATION
        // ==========================================
        function render() {
            applyTheme();
            const loginScreen = document.getElementById('login-screen');
            const appShell = document.getElementById('app-shell');

            if (!state.currentUser) {
                loginScreen.classList.remove('hidden');
                appShell.classList.add('hidden');
                renderLoginView();
                return;
            }

            loginScreen.classList.add('hidden');
            appShell.classList.remove('hidden');
            updateNavbarUI();

            const contentEl = document.getElementById('app-content');
            const isAdmin = state.currentUser.role === 'admin';

            if (!isAdmin && (state.currentView === 'admin' || state.currentView === 'settings')) {
                state.currentView = 'teacher';
            }

            if (state.currentView === 'teacher') {
                contentEl.innerHTML = renderTeacherView();
            } else if (state.currentView === 'admin') {
                contentEl.innerHTML = renderAdminView();
            } else if (state.currentView === 'export') {
                contentEl.innerHTML = renderExportView();
            } else if (state.currentView === 'settings') {
                contentEl.innerHTML = renderSettingsView();
            }
        }

        window.onload = function () {
            loadState();
            const okBtn = document.getElementById('confirm-modal-ok');
            if (okBtn) {
                okBtn.addEventListener('click', () => {
                    const cb = state.confirmCallback;
                    closeConfirmModal();
                    if (typeof cb === 'function') cb();
                });
            }
            render();
            if (isCloudEnabled()) {
                syncFromCloud(true);
            }
        };
    </script>
</body>
</html>
